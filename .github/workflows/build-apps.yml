# Builds the Android APK and the Windows installer from the same web files.
#
# How to run:  GitHub repo > Actions tab > "Build apps" > Run workflow
# Then open the finished run and download the files under "Artifacts".
# (Push a tag such as v1.0.0 and the files are also attached to a GitHub Release.)
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write      # only used to attach the files to a Release

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web files into the Android project
        run: |
          mkdir -p installers/android/www
          cp index.html style.css app.js config.js manifest.webmanifest installers/android/www/
          cp -r icons installers/android/www/icons

      - name: Create the Android project
        working-directory: installers/android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Allow phone notifications
        working-directory: installers/android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            grep -q "android.permission.$P" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
          done

      - name: Build the APK
        working-directory: installers/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp installers/android/android/app/build/outputs/apk/debug/app-debug.apk MedicineMonitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedicineMonitor-Android-APK
          path: MedicineMonitor.apk

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MedicineMonitor.apk

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the web files into the desktop app
        shell: bash
        run: |
          mkdir -p installers/windows/www installers/windows/icons
          cp index.html style.css app.js config.js manifest.webmanifest installers/windows/www/
          cp -r icons installers/windows/www/icons
          cp icons/icon-512.png icons/icon-192.png installers/windows/icons/

      - name: Build the installer
        working-directory: installers/windows
        run: |
          npm install
          npm run dist

      - name: Name the file
        shell: bash
        run: cp installers/windows/dist/*Setup*.exe MedicineMonitor-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MedicineMonitor-Windows-Installer
          path: MedicineMonitor-Setup.exe

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MedicineMonitor-Setup.exe
